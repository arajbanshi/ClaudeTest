<main class="chat-shell">
  @if (error(); as err) {
    <div class="error-banner" role="alert">{{ err }}</div>
  }
  <app-chat-message-list
    [messages]="messages()"
    [currentReply]="currentReply()"
    [isStreaming]="isStreaming()"
  />
  <app-chat-input [disabled]="isStreaming()" (send)="onSend($event)" />
</main>
